# 部署到生产机（Docker Compose）
#
# Actions Secrets（Settings → Secrets and variables → Actions）：
#   DEPLOY_HOST     SSH 主机（未配置时跳过 deploy 任务）
#   DEPLOY_SSH_KEY  SSH 私钥
#   DEPLOY_USER     SSH 用户名（可选，默认 deploy）
#   DEPLOY_PATH     服务器 deploy 目录（可选，默认 /opt/xszs-blog/deploy）
#
# 镜像默认推送到 GHCR：ghcr.io/<owner>/<repo>
# 服务器 deploy/docker-compose.yml 中 server.image 需与此一致。

name: Deploy

on:
  push:
    branches: [main]
    tags: [v*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: vars.ENABLE_SSH_DEPLOY == 'true'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER || 'deploy' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_PATH
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_DIR="${DEPLOY_PATH:-/opt/xszs-blog/deploy}"
            cd "$DEPLOY_DIR"
            docker compose pull server
            docker compose up -d server
